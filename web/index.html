<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ribice &mdash; identification quiz</title>
<meta name="description" content="Answer a few questions and this works out what you saw. The subject comes from whichever knowledge base you point it at.">

<!-- The widget's default theme. Optional: drop it and style .rb-* yourself. -->
<link rel="stylesheet" href="ribice.css">

<style>
  /* This demo page's own chrome. Nothing here belongs to the widget -- it is
     the sort of styling a host application would already have. */
  :root { color-scheme: light dark; --page: #f4f1ea; --text: #1e2a32; --dim: #5f7382; }
  @media (prefers-color-scheme: dark) {
    :root { --page: #12181c; --text: #e8eef2; --dim: #93a6b3; }
  }
  body {
    margin: 0;
    padding: 24px 16px 64px;
    background: var(--page);
    color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 620px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--dim); font-size: 0.93rem; margin: 0 0 22px; }
  footer { text-align: center; color: var(--dim); font-size: 0.8rem; margin-top: 28px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Identification quiz</h1>
    <p class="sub">Answer a few questions and this works out what you saw.</p>
  </header>

  <div id="quiz"></div>

  <footer>
    Runs entirely in your browser &mdash;
    <a href="https://github.com/lpapez/ribice">the engine</a> is Go, compiled to WebAssembly.
  </footer>
</main>

<script type="module">
  // A demo page, not part of the widget. The widget has no dataset of its own,
  // so this picks one: ?kb=<url> to point it anywhere, otherwise the one
  // ./build.sh copied in as demo-kb.json.
  import { createQuiz } from "./ribice.js";
  const kbUrl = new URLSearchParams(location.search).get("kb") || "demo-kb.json";
  const quiz = await createQuiz({
    mount: "#quiz",
    kbUrl,
    settings: { maxQuestions: 20 },
  });
  // the knowledge base names itself; a host application would know its own title
  if (quiz.name) document.title = document.getElementById("title").textContent = quiz.name;
</script>
</body>
</html>
