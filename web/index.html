<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What fish was that?</title>
<meta name="description" content="Describe a fish you saw in the Adriatic and this will work out what it was.">

<!-- The widget's default theme. Optional: drop it and style .rb-* yourself. -->
<link rel="stylesheet" href="ribice.css">

<style>
  /* This demo page's own chrome. Nothing here belongs to the widget -- it is
     the sort of styling a host application would already have. */
  :root { color-scheme: light dark; --page: #f4f1ea; --text: #1e2a32; --dim: #5f7382; }
  @media (prefers-color-scheme: dark) {
    :root { --page: #12181c; --text: #e8eef2; --dim: #93a6b3; }
  }
  body {
    margin: 0;
    padding: 24px 16px 64px;
    background: var(--page);
    color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 620px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--dim); font-size: 0.93rem; margin: 0 0 22px; }
  footer { text-align: center; color: var(--dim); font-size: 0.8rem; margin-top: 28px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <header>
    <h1>What fish was that?</h1>
    <p class="sub">Describe a fish you saw snorkelling in the Adriatic and this will work out what it was.</p>
  </header>

  <div id="fish"></div>

  <footer>
    Runs entirely in your browser &mdash;
    <a href="https://github.com/lpapez/ribice">the engine</a> is Go, compiled to WebAssembly.
  </footer>
</main>

<script type="module">
  import { createQuiz } from "./ribice.js";
  createQuiz({
    mount: "#fish",
    settings: { maxQuestions: 20 },
  });
</script>
</body>
</html>
